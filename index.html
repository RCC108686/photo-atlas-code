<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08080a" />
    <meta
      name="description"
      content="写实图鉴 · 以照片为主的静态图鉴：随机发现、按组浏览、全文搜索。"
    />
    <title>写实图鉴 · Photo Atlas</title>
    <style>
      html,
      body,
      #app {
        height: 100%;
      }
      body {
        margin: 0;
        background: #08080a;
        color: #f5f5f6;
        font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      }
      .boot {
        height: 100%;
        display: grid;
        place-items: center;
        font-size: 13px;
        letter-spacing: 0.12em;
        color: #7e7e87;
      }
      .boot-error {
        height: 100%;
        display: grid;
        place-items: center;
        text-align: center;
        font-size: 14px;
        line-height: 2;
        color: #c4c4ca;
      }
      .boot-error span {
        color: #7e7e87;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="app"><div class="boot">正在加载图鉴…</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
